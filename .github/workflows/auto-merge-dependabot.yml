# Dependabot updates require manual review by default. Automatic merging can
# be deliberately restored later by setting DEPENDABOT_AUTOMERGE=true.
name: Dependabot merge policy

on:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  manual-review:
    name: Manual review required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    if: ${{ github.actor == 'dependabot[bot]' && vars.DEPENDABOT_AUTOMERGE != 'true' }}
    steps:
      - name: Record manual-review policy
        run: |
          echo "## Dependabot update requires manual review" >> "$GITHUB_STEP_SUMMARY"
          echo "Automatic merging is disabled for this repository." >> "$GITHUB_STEP_SUMMARY"

  auto-merge:
    name: Auto-merge enabled Dependabot update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.actor == 'dependabot[bot]' && vars.DEPENDABOT_AUTOMERGE == 'true' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge minor and patch updates
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
